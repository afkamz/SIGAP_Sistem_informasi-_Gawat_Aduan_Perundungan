server {
    listen 80;

    # Serve static files React
    root /usr/share/nginx/html;
    index index.html;

    # Media dan aset statis (video mp4, gambar, audio) dengan dukungan byte-range streaming
    location ~* \.(mp4|webm|ogg|mp3|wav|flac|aac|jpg|jpeg|png|gif|svg|ico|webp)$ {
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Semua route SPA → index.html (client-side routing React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy request /api/ ke backend FastAPI
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy request /uploads/ berkas bukti ke backend FastAPI
    location /uploads/ {
        proxy_pass         http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

