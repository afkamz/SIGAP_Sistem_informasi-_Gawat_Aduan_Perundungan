name: sigap

services:

  # ─── MySQL Database ────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: sigap-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sigap_root_2026
      MYSQL_DATABASE: sigap_db
      MYSQL_USER: sigap_user
      MYSQL_PASSWORD: sigap_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - sigap_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s
      start_period: 30s

  # ─── FastAPI Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend/sigap-backend
      dockerfile: Dockerfile
    container_name: sigap-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/sigap-backend/.env
    volumes:
      - ./backend/sigap-backend:/app
      - ./dataset:/app/dataset
    depends_on:
      db:
        condition: service_healthy

  # ─── React Frontend (Vite → build → Nginx) ─────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: sigap-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ─── phpMyAdmin ─────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sigap-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: sigap_user
      PMA_PASSWORD: sigap_pass_2026
    depends_on:
      db:
        condition: service_healthy

volumes:
  sigap_db_data:
